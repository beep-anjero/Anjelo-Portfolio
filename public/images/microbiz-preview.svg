<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#251D1D"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#946D6D" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#322727" stop-opacity="0.9"/>
      <stop stop-color="#2A2121" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B0CDE6"/>
      <stop stop-color="#8BB4D9"/>
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A290B7"/>
      <stop stop-color="#806D96"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Top App Navigation Bar Mockup -->
  <rect x="40" y="30" width="720" height="54" rx="12" fill="#322727" stroke="#946D6D" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="65" cy="57" r="6" fill="#E08282"/>
  <circle cx="85" cy="57" r="6" fill="#FDF4D2" fill-opacity="0.6"/>
  <circle cx="105" cy="57" r="6" fill="#B0CDE6"/>
  
  <!-- App Title & Status -->
  <text x="135" y="62" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#FDF4D2" letter-spacing="1">MICROBIZ POS &amp; INVENTORY</text>
  <rect x="580" y="44" width="160" height="26" rx="13" fill="#B0CDE6" fill-opacity="0.15" stroke="#B0CDE6" stroke-width="1"/>
  <circle cx="596" cy="57" r="4" fill="#10B981"/>
  <text x="608" y="61" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#B0CDE6" letter-spacing="0.5">LOCAL SQLITE · SYNCED</text>

  <!-- Left Column: Metrics & POS Dashboard -->
  <g transform="translate(40, 100)">
    <!-- Summary Stat 1 -->
    <rect x="0" y="0" width="225" height="100" rx="12" fill="#322727" stroke="#946D6D" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A290B7" letter-spacing="1">TODAY'S REVENUE</text>
    <text x="20" y="65" font-family="'Montserrat', sans-serif" font-size="24" font-weight="800" fill="#FDF4D2">₱24,850.00</text>
    <text x="20" y="85" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10B981">+18.4% vs yesterday</text>

    <!-- Summary Stat 2 -->
    <rect x="245" y="0" width="225" height="100" rx="12" fill="#322727" stroke="#946D6D" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="265" y="30" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A290B7" letter-spacing="1">INVENTORY ITEMS</text>
    <text x="265" y="65" font-family="'Montserrat', sans-serif" font-size="24" font-weight="800" fill="#FDF4D2">1,420 SKU</text>
    <text x="265" y="85" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#B0CDE6">98.2% in stock</text>

    <!-- Sales Chart Visual -->
    <rect x="0" y="116" width="470" height="195" rx="12" fill="#322727" stroke="#946D6D" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="20" y="142" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FDF4D2" letter-spacing="0.5">HOURLY TRANSACTION VELOCITY</text>
    <path d="M 30 260 C 90 240, 130 270, 180 210 C 230 160, 270 230, 320 180 C 370 140, 410 170, 440 150" fill="none" stroke="#B0CDE6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 260 C 90 240, 130 270, 180 210 C 230 160, 270 230, 320 180 C 370 140, 410 170, 440 150 L 440 285 L 30 285 Z" fill="url(#skyGrad)" fill-opacity="0.1"/>
    <!-- Data points -->
    <circle cx="180" cy="210" r="5" fill="#B0CDE6" stroke="#251D1D" stroke-width="2"/>
    <circle cx="320" cy="180" r="5" fill="#B0CDE6" stroke="#251D1D" stroke-width="2"/>
    <circle cx="440" cy="150" r="5" fill="#B0CDE6" stroke="#251D1D" stroke-width="2"/>
    <line x1="30" y1="285" x2="440" y2="285" stroke="#946D6D" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Right Column: Mobile POS Preview Card -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="230" height="311" rx="16" fill="#322727" stroke="#B0CDE6" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Phone Screen Header -->
    <rect x="15" y="15" width="200" height="35" rx="8" fill="#251D1D"/>
    <text x="28" y="37" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#FDF4D2">QUICK CHECKOUT</text>
    <rect x="165" y="24" width="38" height="18" rx="5" fill="#A290B7" fill-opacity="0.3"/>
    <text x="172" y="36" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#A290B7">#042</text>

    <!-- Item List -->
    <rect x="15" y="60" width="200" height="42" rx="8" fill="#251D1D" stroke="#946D6D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="25" y="78" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FDF4D2">Espresso Blend x2</text>
    <text x="25" y="93" font-family="'Inter', sans-serif" font-size="9" fill="#A290B7">SKU: ESP-001</text>
    <text x="170" y="86" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#B0CDE6">₱320</text>

    <rect x="15" y="110" width="200" height="42" rx="8" fill="#251D1D" stroke="#946D6D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="25" y="128" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FDF4D2">Artisan Bread x1</text>
    <text x="25" y="143" font-family="'Inter', sans-serif" font-size="9" fill="#A290B7">SKU: BAK-104</text>
    <text x="170" y="136" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#B0CDE6">₱180</text>

    <rect x="15" y="160" width="200" height="42" rx="8" fill="#251D1D" stroke="#946D6D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="25" y="178" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FDF4D2">Cold Brew Bottle x3</text>
    <text x="25" y="193" font-family="'Inter', sans-serif" font-size="9" fill="#A290B7">SKU: DRK-302</text>
    <text x="170" y="186" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#B0CDE6">₱450</text>

    <!-- Total and Button -->
    <line x1="15" y1="218" x2="215" y2="218" stroke="#946D6D" stroke-width="1" stroke-opacity="0.3"/>
    <text x="15" y="240" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#A290B7">TOTAL DUE</text>
    <text x="150" y="242" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#FDF4D2">₱950.00</text>

    <rect x="15" y="258" width="200" height="38" rx="10" fill="#B0CDE6"/>
    <text x="65" y="282" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#251D1D" letter-spacing="1">PROCESS ORDER ➔</text>
  </g>
</svg>
